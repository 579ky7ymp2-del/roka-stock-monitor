name: ROKA Stock Monitor

on:
  push:
    paths:
      - ".github/workflows/roka-stock-monitor.yml"
      - "roka_stock_bot.py"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: roka-stock-monitor
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check-stock:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check ROKA size L
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python roka_stock_bot.py
      - name: Save stock state
        run: |
          if git diff --quiet -- roka_state.json roka_history.jsonl; then
            echo "No state or history change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add roka_state.json roka_history.jsonl
          git commit -m "Update ROKA stock history"
          git push
